; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = bitcoinSwitch
;default_envs = esp-wrover-kit

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize
board_build.partitions = min_spiffs.csv
lib_deps =
	WebSockets@^2.6.1
	ArduinoJson@^7.3.1
	tzapu/WiFiManager@^2.0.17

[env:esp32dev]
board = esp32dev
build_flags =
	-D TOUCH_PIN=T9 ; GPIO32
	-D LED_BUILTIN=22
	-D LED_ON=LOW

[env:lilygo-t-display]
board = lilygo-t-display
lib_deps = 
	${env.lib_deps}
	TFT_eSPI
build_flags =
	-D TOUCH_PIN=T5 ; GPIO12
	-D BT1_PIN=35
    -D TFT
	-D USER_SETUP_LOADED=1
	-include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup25_TTGO_T_Display.h
	-D TOUCH_CS=-1

[env:esp-wrover-kit]
board = esp-wrover-kit
build_flags =
	-D LED_BUILTIN=2
	-D LED_ON=HIGH
	-D BT1_PIN=0

[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
build_flags =
	-D LED_ON=LOW
	-D BT1_PIN=0

[env:esp32c3_super_mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nologo_esp32c3_super_mini
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
;	-D LED_BUILTIN=8
	-D LED_ON=LOW
	-D BT1_PIN=9

[env:esp32c3_super_mini_plus]
extends = env:esp32c3_super_mini
build_flags =
    ${env:esp32c3_super_mini.build_flags}
	-D LED_ON=HIGH

[env:esp32-s2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s2-saola-1